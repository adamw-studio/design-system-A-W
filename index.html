<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/icons/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Roboto+Mono:wght@400..500&display=swap"
    />
    <!-- Machine-readable versions of the design system for AI agents and tools -->
    <link rel="alternate" type="text/markdown" href="/llms.txt" title="LLM-readable summary (llms.txt)" />
    <link rel="alternate" type="application/design-tokens+json" href="/tokens/colors.json" title="Color design tokens" />
    <link rel="alternate" type="application/design-tokens+json" href="/tokens/typography.json" title="Typography design tokens" />
    <title>Design System – A/W</title>
    <!-- Apply the saved (or system) theme and sidebar width before first paint;
         see src/lib/theme.ts and src/lib/sidebar-resize.ts. -->
    <script>
      try {
        var theme = localStorage.getItem("aw-theme");
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
        // Saved sidebar width (src/lib/sidebar-resize.ts clamps it on load).
        var width = parseFloat(localStorage.getItem("aw-sidebar-width"));
        if (width > 0) document.documentElement.style.setProperty("--layout-sidebar-width", width + "px");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__header">
          <a href="#overview" class="sidebar__logo" aria-label="A/W Design System home">
            <span class="sidebar__logo-mark" aria-hidden="true"></span>
          </a>
        </div>

        <!-- Figma "Design System - Web", node 302:2196 -->
        <nav class="nav" aria-label="Design system">
          <a href="#overview" class="nav__item nav__link text-body-large" data-route="overview">Overview</a>
          <div class="nav__section" data-expanded="true">
            <button
              type="button"
              class="nav__section-toggle text-body-large"
              aria-expanded="true"
              aria-controls="nav-foundation"
            >
              Foundation
              <svg class="icon icon--16 nav__chevron" aria-hidden="true"><use href="#icon-nav-arrow-down"></use></svg>
            </button>
            <div class="nav__collapse" id="nav-foundation">
              <div class="nav__section-items">
              <div class="nav__group" data-expanded="false">
                <div class="nav__item nav__item--parent">
                  <a href="#primitives" class="nav__link text-body-large">Colors</a>
                  <button
                    type="button"
                    class="nav__toggle"
                    aria-expanded="false"
                    aria-controls="nav-colors"
                    aria-label="Colors pages"
                  >
                    <svg class="icon icon--16 nav__chevron" aria-hidden="true"><use href="#icon-nav-arrow-down"></use></svg>
                  </button>
                </div>
                <div class="nav__collapse" id="nav-colors">
                  <ul class="nav__sublist">
                    <li>
                      <a href="#primitives" class="nav__item nav__link text-body-large" data-route="primitives">Primitives</a>
                    </li>
                    <li>
                      <a href="#tokens" class="nav__item nav__link text-body-large" data-route="tokens">Tokens</a>
                    </li>
                  </ul>
                </div>
              </div>
              <a href="#typography" class="nav__item nav__link text-body-large" data-route="typography">Typography</a>
              <a href="#elevation" class="nav__item nav__link text-body-large" data-route="elevation">Elevation</a>
              <a href="#icons" class="nav__item nav__link text-body-large" data-route="icons">Icons</a>
              <a href="#grid" class="nav__item nav__link text-body-large" data-route="grid">Grid</a>
              </div>
            </div>
          </div>
          <div class="nav__section" data-expanded="true">
            <button
              type="button"
              class="nav__section-toggle text-body-large"
              aria-expanded="true"
              aria-controls="nav-components"
            >
              Components
              <svg class="icon icon--16 nav__chevron" aria-hidden="true"><use href="#icon-nav-arrow-down"></use></svg>
            </button>
            <div class="nav__collapse" id="nav-components">
              <div class="nav__section-items">
              <div class="nav__group" data-expanded="false">
                <div class="nav__item nav__item--parent">
                  <a href="#buttons" class="nav__link text-body-large">Buttons</a>
                  <button
                    type="button"
                    class="nav__toggle"
                    aria-expanded="false"
                    aria-controls="nav-buttons"
                    aria-label="Buttons pages"
                  >
                    <svg class="icon icon--16 nav__chevron" aria-hidden="true"><use href="#icon-nav-arrow-down"></use></svg>
                  </button>
                </div>
                <div class="nav__collapse" id="nav-buttons">
                  <ul class="nav__sublist">
                    <li>
                      <a href="#buttons" class="nav__item nav__link text-body-large" data-route="buttons">Buttons</a>
                    </li>
                    <li>
                      <a href="#icon-buttons" class="nav__item nav__link text-body-large" data-route="icon-buttons">Icon Buttons</a>
                    </li>
                  </ul>
                </div>
              </div>
              <a href="#dropdown" class="nav__item nav__link text-body-large" data-route="dropdown">Dropdown</a>
              <a href="#menu" class="nav__item nav__link text-body-large" data-route="menu">Menu</a>
              <a href="#switch" class="nav__item nav__link text-body-large" data-route="switch">Switch</a>
              <a href="#tags" class="nav__item nav__link text-body-large" data-route="tags">Tags</a>
              </div>
            </div>
          </div>
        </nav>

      </aside>

      <!-- Drag (or arrow keys) to resize the sidebar; src/lib/sidebar-resize.ts -->
      <div
        class="sidebar-resizer"
        id="sidebar-resizer"
        role="separator"
        aria-orientation="vertical"
        aria-controls="sidebar"
        aria-label="Resize sidebar"
        title="Drag to resize · double-click to reset"
        tabindex="0"
      ></div>

      <main class="panel">
        <!-- Frosted edges while there's more to scroll (Figma 309:3325); src/lib/scroll-fade.ts -->
        <div class="panel__edge panel__edge--top" aria-hidden="true"></div>
        <div class="page">
          <header class="page__header">
            <div class="page__topbar">
              <p class="page__crumb text-body-large" id="page-crumb"></p>
              <div class="page__actions" id="page-actions"></div>
            </div>
            <h1 class="page__title text-heading-large" id="page-title">Colors</h1>
            <p class="page__subtitle text-body-large" id="page-subtitle"></p>
            <div class="doc-rule" aria-hidden="true"></div>
          </header>
          <p class="page__description text-body-large" id="page-description">Add a short description...</p>
          <div class="page__body" id="page-body"></div>
        </div>
        <div class="panel__edge panel__edge--bottom" aria-hidden="true"></div>
      </main>
    </div>

    <!-- Theme toggle, floating over the content (src/lib/theme.ts) -->
    <!-- Bottom-right corner (Figma 313:4406 / 313:4597): the Theme switch
         and a button that opens the "For AI agents & tools" panel above them.
         The panel comes after the controls so Tab reaches it next; CSS
         stacks it on top. Logic: src/lib/theme.ts, src/lib/agent-links.ts. -->
    <div class="corner" id="corner">
      <div class="corner__controls">
        <label class="corner__control corner__theme">
          <span class="text-body-medium-strong">Theme</span>
          <button class="switch" type="button" role="switch" aria-checked="false" aria-label="Dark theme" id="theme-switch">
            <span class="switch__knob"></span>
          </button>
        </label>
        <button class="corner__control corner__button" type="button" id="agent-toggle" aria-expanded="false" aria-controls="agent-panel" aria-label="For AI agents &amp; tools" title="For AI agents &amp; tools">
          <svg class="icon icon--16" aria-hidden="true"><use href="#icon-internet"></use></svg>
        </button>
      </div>
      <aside class="corner__panel agent-links" id="agent-panel" aria-labelledby="agent-links-title" inert></aside>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
